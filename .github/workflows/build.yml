name: Build BBB APK

on:

  workflow_dispatch:

  push:

    branches:

      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Setup Java

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: '17'

      - name: Setup Android

        uses: android-actions/setup-android@v4

      - name: Install SDK

        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project

        run: |

          mkdir project

          unzip -q BBB_CODM_EDITION_Project.zip -d project

      - name: Build APK

        run: |

          cd project/BBB_CODM_EDITION

          gradle assembleDebug

      - name: Upload APK

        uses: actions/upload-artifact@v4

        with:

          name: BBB-APK

          path: project/BBB_CODM_EDITION/app/build/outputs/apk/debug/app-debug.apk
